name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Python 3.8 on an image supported by setup-python.
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run Python regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run Windows installer regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_installer.ps1

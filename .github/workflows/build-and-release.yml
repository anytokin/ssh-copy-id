name: Build Windows EXE with uv

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync

      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $sourceVersion = uv run python -c "from ssh_copy_id.version import get_version; print(get_version())"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the package version."
          }
          $expectedTag = "v$($sourceVersion.Trim())"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }

      - name: Run Python regression tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run Windows installer regression tests
        shell: powershell
        run: ./tests/test_installer.ps1

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller --icon=logo.ico --onefile --name ssh-copy-id --paths src src/ssh_copy_id/main.py

      - name: Check EXE reports package version
        shell: pwsh
        run: |
          $sourceVersion = uv run python -c "from ssh_copy_id.version import get_version; print(get_version())"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the package version."
          }
          $exeVersion = & ./dist/ssh-copy-id.exe -v
          if ($LASTEXITCODE -ne 0) {
            throw "The compiled executable failed its version check."
          }
          if ($exeVersion.Trim() -cne $sourceVersion.Trim()) {
            throw "EXE version '$exeVersion' does not match package version '$sourceVersion'."
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-copy-id-windows-${{ github.ref_name }}
          path: dist/ssh-copy-id.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ssh-copy-id-windows-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/ssh-copy-id.exe
